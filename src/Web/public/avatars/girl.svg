<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Clay-style girl avatar">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffe3ec"/>
      <stop offset="1" stop-color="#f7b8cb"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe6d5"/>
      <stop offset="0.6" stop-color="#f7c3a4"/>
      <stop offset="1" stop-color="#e29c7c"/>
    </radialGradient>
    <radialGradient id="hair" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#9a5f45"/>
      <stop offset="0.7" stop-color="#6b3b2a"/>
      <stop offset="1" stop-color="#4a271c"/>
    </radialGradient>
    <radialGradient id="shirt" cx="40%" cy="20%" r="80%">
      <stop offset="0" stop-color="#ffc4d6"/>
      <stop offset="1" stop-color="#e86f98"/>
    </radialGradient>
    <radialGradient id="bow" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a019"/>
    </radialGradient>
    <filter id="clay" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8a3b52" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- shoulders -->
    <ellipse cx="100" cy="212" rx="66" ry="52" fill="url(#shirt)" filter="url(#clay)"/>
    <path d="M84 162 Q100 176 116 162" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="100" cy="152" rx="15" ry="14" fill="url(#skin)"/>

    <!-- back hair + pigtails -->
    <ellipse cx="100" cy="98" rx="58" ry="60" fill="url(#hair)" filter="url(#clay)"/>
    <circle cx="40" cy="122" r="24" fill="url(#hair)" filter="url(#clay)"/>
    <circle cx="160" cy="122" r="24" fill="url(#hair)" filter="url(#clay)"/>

    <!-- head -->
    <ellipse cx="100" cy="104" rx="45" ry="47" fill="url(#skin)" filter="url(#clay)"/>

    <!-- bangs -->
    <path d="M54 100 C50 50 150 50 146 100 C140 80 124 70 106 76 C96 64 70 68 54 100 Z" fill="url(#hair)"/>
    <ellipse cx="82" cy="66" rx="16" ry="6" fill="#fff" opacity="0.25" filter="url(#soft)"/>

    <!-- bows -->
    <g filter="url(#clay)">
      <ellipse cx="38" cy="94" rx="13" ry="8" transform="rotate(-30 38 94)" fill="url(#bow)"/>
      <ellipse cx="58" cy="84" rx="13" ry="8" transform="rotate(-30 58 84)" fill="url(#bow)"/>
      <circle cx="48" cy="89" r="6" fill="#f08c00"/>
      <ellipse cx="142" cy="84" rx="13" ry="8" transform="rotate(30 142 84)" fill="url(#bow)"/>
      <ellipse cx="162" cy="94" rx="13" ry="8" transform="rotate(30 162 94)" fill="url(#bow)"/>
      <circle cx="152" cy="89" r="6" fill="#f08c00"/>
    </g>

    <!-- face -->
    <ellipse cx="80" cy="84" rx="12" ry="6" fill="#fff" opacity="0.35" filter="url(#soft)"/>
    <ellipse cx="82" cy="110" rx="6.5" ry="7.5" fill="#2b1a14"/>
    <ellipse cx="118" cy="110" rx="6.5" ry="7.5" fill="#2b1a14"/>
    <circle cx="84.5" cy="107" r="2.4" fill="#fff"/>
    <circle cx="120.5" cy="107" r="2.4" fill="#fff"/>
    <path d="M74 104 L71 100 M77 102 L75 98" stroke="#2b1a14" stroke-width="2" stroke-linecap="round"/>
    <path d="M126 104 L129 100 M123 102 L125 98" stroke="#2b1a14" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="70" cy="125" rx="9" ry="6" fill="#ff7f9e" opacity="0.5" filter="url(#soft)"/>
    <ellipse cx="130" cy="125" rx="9" ry="6" fill="#ff7f9e" opacity="0.5" filter="url(#soft)"/>
    <ellipse cx="100" cy="120" rx="3.5" ry="2.5" fill="#e0927a"/>
    <path d="M91 129 Q100 138 109 129" fill="#c9505a" stroke="#b0404c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
