<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Clay-style boy avatar">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#dff1ff"/>
      <stop offset="1" stop-color="#a9d2f2"/>
    </radialGradient>
    <radialGradient id="skin" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffe2cc"/>
      <stop offset="0.6" stop-color="#f2b894"/>
      <stop offset="1" stop-color="#d98f6c"/>
    </radialGradient>
    <radialGradient id="hair" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#5a4035"/>
      <stop offset="0.7" stop-color="#352219"/>
      <stop offset="1" stop-color="#22150f"/>
    </radialGradient>
    <radialGradient id="shirt" cx="40%" cy="20%" r="80%">
      <stop offset="0" stop-color="#8fd6c2"/>
      <stop offset="1" stop-color="#2f9e86"/>
    </radialGradient>
    <filter id="clay" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2d5670" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="circle"><circle cx="100" cy="100" r="100"/></clipPath>
  </defs>

  <g clip-path="url(#circle)">
    <rect width="200" height="200" fill="url(#bg)"/>

    <!-- shoulders + collar -->
    <ellipse cx="100" cy="212" rx="68" ry="52" fill="url(#shirt)" filter="url(#clay)"/>
    <ellipse cx="100" cy="152" rx="15" ry="14" fill="url(#skin)"/>
    <path d="M80 164 L100 176 L120 164" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- ears -->
    <circle cx="55" cy="110" r="10" fill="url(#skin)" filter="url(#clay)"/>
    <circle cx="145" cy="110" r="10" fill="url(#skin)" filter="url(#clay)"/>
    <circle cx="56" cy="110" r="4.5" fill="#d98f6c" opacity="0.6"/>
    <circle cx="144" cy="110" r="4.5" fill="#d98f6c" opacity="0.6"/>

    <!-- head -->
    <ellipse cx="100" cy="106" rx="45" ry="47" fill="url(#skin)" filter="url(#clay)"/>

    <!-- tousled hair -->
    <g filter="url(#clay)">
      <path d="M55 100 C48 58 78 42 100 44 C124 42 154 58 145 100 C140 84 132 76 122 78 C118 66 104 66 98 74 C88 64 70 70 66 84 C60 86 57 92 55 100 Z" fill="url(#hair)"/>
      <path d="M92 48 C94 32 112 28 120 38 C110 38 102 42 96 50 Z" fill="url(#hair)"/>
      <path d="M118 46 C128 36 144 42 146 54 C138 48 128 46 120 50 Z" fill="url(#hair)"/>
    </g>
    <ellipse cx="86" cy="58" rx="16" ry="5" fill="#fff" opacity="0.22" filter="url(#soft)"/>

    <!-- face -->
    <ellipse cx="80" cy="88" rx="12" ry="6" fill="#fff" opacity="0.3" filter="url(#soft)"/>
    <path d="M73 97 Q82 92 90 96" fill="none" stroke="#352219" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M110 96 Q118 92 127 97" fill="none" stroke="#352219" stroke-width="3.5" stroke-linecap="round"/>
    <ellipse cx="82" cy="110" rx="6.5" ry="7.5" fill="#22150f"/>
    <ellipse cx="118" cy="110" rx="6.5" ry="7.5" fill="#22150f"/>
    <circle cx="84.5" cy="107" r="2.4" fill="#fff"/>
    <circle cx="120.5" cy="107" r="2.4" fill="#fff"/>
    <ellipse cx="70" cy="126" rx="9" ry="5.5" fill="#f28b7d" opacity="0.4" filter="url(#soft)"/>
    <ellipse cx="130" cy="126" rx="9" ry="5.5" fill="#f28b7d" opacity="0.4" filter="url(#soft)"/>
    <ellipse cx="100" cy="121" rx="4" ry="3" fill="#d98f6c"/>
    <path d="M88 130 Q100 142 112 130 Z" fill="#9c3b3b" stroke="#8a3030" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M92 131.5 Q100 134 108 131.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
